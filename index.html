<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topolino Car Game</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: 'Segoe UI', sans-serif; }
        @keyframes parkingBlink { 0%,100%{opacity:1} 50%{opacity:0.15} }
        canvas { display: block; }

        /* ── QR Code (haut-droite) ── */
        #qr-wrap {
            position: absolute; top: 10px; right: 10px;
            background: rgba(255,255,255,0.92); border-radius: 10px;
            padding: 8px 8px 4px;
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.3);
            pointer-events: none; z-index: 95;
        }
        #qr-canvas { width: 96px; height: 96px; }
        #qr-label  { font-size: 9px; color: #333; text-align: center; max-width: 96px;
                     overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #qr-hint   { font-size: 10px; color: #555; font-weight: 600; }

        /* ── Debug caméra (bas-gauche) ── */
        #cam-debug {
            position: absolute; bottom: 10px; left: 10px;
            background: rgba(0,0,0,0.55); color: #0ff;
            font-family: monospace; font-size: 12px; line-height: 1.7;
            padding: 6px 10px; border-radius: 6px;
            pointer-events: none; z-index: 95;
        }

        /* ── Barre de modes (bas-centre) ── */
        #mode-bar {
            position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 6px; align-items: center;
            pointer-events: auto; z-index: 95;
        }
        .mode-btn {
            background: rgba(0,0,0,0.55); color: #fff; border: none;
            border-radius: 24px; padding: 8px 16px;
            font-size: 13px; font-weight: 700;
            cursor: pointer; backdrop-filter: blur(6px);
            transition: background 0.15s, transform 0.1s;
            white-space: nowrap;
        }
        .mode-btn:hover  { background: rgba(255,255,255,0.18); transform: translateY(-2px); }
        .mode-btn.active { background: rgba(255,200,0,0.80); color: #000; }
        .mode-btn.wip    { opacity: 0.45; cursor: default; }
        .mode-btn.wip:hover { transform: none; background: rgba(0,0,0,0.55); }
    </style>
</head>
<body>

    <!-- QR Code -->
    <div id="qr-wrap">
        <div id="qr-hint">📱 Rejoindre</div>
        <div id="qr-canvas"></div>
        <div id="qr-label">chargement…</div>
    </div>

    <!-- Debug caméra (bas-gauche) -->
    <div id="cam-debug">—</div>
    <div id="fps-counter" style="position: absolute; top: 10px; left: 10px; color: lime; font-family: monospace; font-weight: bold; z-index: 1000; text-shadow: 1px 1px 2px black;">FPS: 60</div>

    <!-- Barre de modes (bas) -->
    <div id="mode-bar">
        <button class="mode-btn" id="btn-drive"   onclick="go('drive')"  >🏔 Conduite</button>
        <button class="mode-btn" id="btn-chase"   onclick="go('chase')"  >🧳 Poursuite</button>
        <button class="mode-btn" id="btn-parking" onclick="go('parking')">🅿 Parking</button>
        <button class="mode-btn" id="btn-tron"   onclick="go('tron')"  >🌀 Tron</button>
        <button class="mode-btn" id="btn-derby"  onclick="go('derby')" >💥 Derby</button>
        <button class="mode-btn" id="btn-battle" onclick="go('battle')">🎈 Battle</button>
        <button class="mode-btn" id="btn-foot"   onclick="go('foot')"  >⚽ Foot</button>
    </div>

    <!-- Socket.IO -->
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <!-- QRCode.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- ES module shims + importmap -->
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
<script>
    const mode = new URLSearchParams(location.search).get('mode') ?? 'drive';
    document.getElementById('btn-' + mode)?.classList.add('active');

    // Capture d'erreurs pour le debug
    window.addEventListener('error', function(event) {
        const errDiv = document.createElement('div');
        errDiv.style.position = 'absolute';
        errDiv.style.top = '50px';
        errDiv.style.left = '50px';
        errDiv.style.background = 'red';
        errDiv.style.color = 'white';
        errDiv.style.zIndex = '9999';
        errDiv.innerText = event.message + ' at ' + event.filename + ':' + event.lineno;
        document.body.appendChild(errDiv);
        });

        function go(m) { window.location.href = '?mode=' + m; }
    </script>

    <script type="module" src="src/main.js"></script>
</body>
</html>
