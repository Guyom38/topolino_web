<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Topolino — Manette</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; touch-action: none;
            user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background: #0d0f18; color: #fff; font-family: 'Segoe UI', sans-serif;
               overflow: hidden; width: 100vw; height: 100vh; }

        #landscape, #portrait { display: none; width: 100vw; height: 100vh; }
        @media (orientation: landscape) { #landscape { display: flex; } }
        @media (orientation: portrait)  { #portrait  { display: flex; } }

        /* ════════ PORTRAIT ════════ */
        #portrait {
            flex-direction: column; align-items: center;
            background: radial-gradient(ellipse at center, #1a1a3e 0%, #0d0d1a 100%);
            overflow-y: auto;
        }
        .step { display: none; flex-direction: column; align-items: center;
                gap: 18px; padding: 28px 20px; width: 100%; max-width: 400px; }
        .step.active { display: flex; }
        .step h2 { font-size: 22px; font-weight: 700; text-align: center; }

        .cfg-block { width: 100%; }
        .cfg-block label { display: block; font-size: 11px; opacity: 0.5; margin-bottom: 8px;
                           text-transform: uppercase; letter-spacing: .06em; }
        .cfg-block input[type="text"] {
            width: 100%; padding: 13px 16px;
            background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.18);
            border-radius: 14px; color: white; font-size: 18px; outline: none;
        }
        #palette { display: flex; flex-wrap: wrap; gap: 10px; }
        .swatch { width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
                  border: 3px solid transparent; transition: transform .1s, border-color .1s; }
        .swatch.on { border-color: #fff; transform: scale(1.25); }

        .btn-primary {
            width: 100%; padding: 15px;
            background: linear-gradient(145deg, #7c3aed, #9b59b6);
            border: none; border-radius: 16px;
            color: white; font-size: 17px; font-weight: 700; cursor: pointer;
        }
        .btn-primary:active { filter: brightness(.8); }
        .btn-secondary {
            width: 100%; padding: 11px;
            background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.18);
            border-radius: 14px; color: rgba(255,255,255,0.65); font-size: 14px;
            font-weight: 600; cursor: pointer;
        }
        #portrait-status { font-size: 13px; opacity: 0.4; text-align: center; }

        /* Caméra */
        #cam-container {
            width: 190px; height: 190px; border-radius: 50%; overflow: hidden;
            border: 4px solid rgba(255,255,255,0.28); position: relative; background: #111;
        }
        #cam-container video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        #cam-overlay {
            position: absolute; inset: 0; border-radius: 50%;
            background: rgba(0,0,0,0.45);
            display: flex; align-items: center; justify-content: center; pointer-events: none;
        }
        #cam-overlay.hidden { display: none; }
        #expr-label { font-size: 17px; font-weight: 700; text-align: center; }
        #expr-hint  { font-size: 12px; opacity: 0.65; text-align: center; }
        #btn-capture {
            width: 66px; height: 66px; border-radius: 50%;
            background: white; border: 4px solid rgba(255,255,255,0.35);
            cursor: pointer; box-shadow: 0 0 0 3px rgba(255,255,255,0.25);
        }
        #btn-capture:active { transform: scale(0.9); }
        #thumbs { display: flex; gap: 7px; flex-wrap: wrap; justify-content: center; }
        .thumb-slot {
            width: 46px; height: 46px; border-radius: 50%; overflow: hidden;
            border: 2px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.04);
            display: flex; align-items: center; justify-content: center; font-size: 17px;
        }
        .thumb-slot img { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .thumb-slot.done   { border-color: #4caf50; }
        .thumb-slot.active { border-color: #fff; box-shadow: 0 0 0 2px rgba(255,255,255,0.4); }
        #cam-progress { font-size: 12px; opacity: 0.55; text-align: center; }
        #cam-no-access {
            font-size: 13px; opacity: 0.6; text-align: center; line-height: 1.7;
            display: none; padding: 8px 12px;
            background: rgba(255,100,0,0.12); border-radius: 10px;
        }

        /* ════════ LANDSCAPE : MANETTE ════════ */
        #landscape {
            align-items: stretch; justify-content: stretch;
            background: #0d0f18; padding: 8px; gap: 8px;
        }

        /* Zone joystick (gauche) */
        #js-zone {
            flex: 0 0 auto;
            width: 44vw; max-width: 260px;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 8px;
        }
        #js-label {
            font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.3);
            letter-spacing: 2px; text-transform: uppercase;
        }
        #js-base {
            position: relative;
            width: min(44vw, 220px); height: min(44vw, 220px);
            max-width: 220px; max-height: 220px;
        }
        #js-ring {
            position: absolute; inset: 0; border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.1);
            background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.04), transparent 70%);
        }
        /* Indicateur direction (arc lumineux) */
        #js-ring::after {
            content: ''; position: absolute; inset: 6px; border-radius: 50%;
            border: 2px solid transparent;
        }
        #js-cross {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            pointer-events: none;
        }
        #js-cross::before {
            content: ''; position: absolute;
            width: 1px; height: 60%; background: rgba(255,255,255,0.06);
        }
        #js-cross::after {
            content: ''; position: absolute;
            width: 60%; height: 1px; background: rgba(255,255,255,0.06);
        }
        #js-thumb {
            position: absolute;
            width: 64px; height: 64px; border-radius: 50%;
            background: radial-gradient(circle at 38% 35%, #5a7fff, #2244cc);
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            box-shadow: 0 4px 18px rgba(60,100,255,0.5), 0 0 0 3px rgba(100,140,255,0.2);
            transition: box-shadow .1s;
            pointer-events: none;
        }
        #js-thumb.active {
            box-shadow: 0 4px 24px rgba(60,100,255,0.8), 0 0 0 4px rgba(100,140,255,0.4);
        }

        /* Zone info centrale */
        #info-zone {
            flex: 1 1 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 6px;
        }
        #avatar-circle {
            width: 52px; height: 52px; border-radius: 50%;
            border: 3px solid #5a7fff; overflow: hidden; background: #333;
        }
        #avatar-circle img { width: 100%; height: 100%; object-fit: cover; }
        #avatar-initial {
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; font-weight: 900;
        }
        #info-name {
            font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.8);
            max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            text-align: center;
        }
        #conn-dot {
            width: 8px; height: 8px; border-radius: 50%; background: #c44;
        }
        #conn-dot.ok { background: #4c4; }

        /* Zone boutons (droite) */
        #btn-zone {
            flex: 0 0 auto;
            width: 44vw; max-width: 260px;
            display: grid;
            grid-template-rows: 1fr 1fr;
            grid-template-columns: 1fr auto;
            gap: 8px;
            padding: 2px;
        }

        .game-btn {
            border-radius: 16px; border: none;
            font-size: 15px; font-weight: 900; letter-spacing: 1px;
            color: white; cursor: pointer;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 4px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
            -webkit-tap-highlight-color: transparent;
            transition: filter .06s, transform .06s;
        }
        .game-btn:active, .game-btn.pressed {
            filter: brightness(0.75); transform: scale(0.96);
        }
        .game-btn .btn-icon { font-size: 24px; line-height: 1; }
        .game-btn .btn-text { font-size: 10px; letter-spacing: 2px; opacity: 0.85; }

        /* AVANCER — grande, colonne 1, ligne 1+2 */
        #btn-go {
            grid-row: 1 / 2; grid-column: 1 / 2;
            background: linear-gradient(160deg, #22c55e, #16a34a);
            box-shadow: 0 4px 20px rgba(34,197,94,0.35);
        }
        #btn-go.pressed { box-shadow: 0 2px 8px rgba(34,197,94,0.2); }

        /* RECULER — petite, colonne 1, ligne 2 */
        #btn-rev {
            grid-row: 2 / 3; grid-column: 1 / 2;
            background: linear-gradient(160deg, #f59e0b, #d97706);
            box-shadow: 0 4px 16px rgba(245,158,11,0.3);
        }

        /* FREIN — carré, colonne 2, lignes 1+2 */
        #btn-hb {
            grid-row: 1 / 3; grid-column: 2 / 3;
            width: min(22vw, 110px);
            background: linear-gradient(160deg, #ef4444, #b91c1c);
            box-shadow: 0 4px 20px rgba(239,68,68,0.35);
            border-radius: 20px;
        }
        #btn-hb.pressed { box-shadow: 0 2px 8px rgba(239,68,68,0.2); }
    </style>
</head>
<body>

<!-- ════════ PORTRAIT ════════ -->
<div id="portrait">

    <div class="step active" id="step-config">
        <h2>🚗 Topolino</h2>
        <div class="cfg-block">
            <label>Votre nom</label>
            <input type="text" id="inp-name" placeholder="Joueur" maxlength="20" autocomplete="off" autocorrect="off">
        </div>
        <div class="cfg-block">
            <label>Couleur du véhicule</label>
            <div id="palette"></div>
        </div>
        <button class="btn-primary" id="btn-next">📸 Capturer mes expressions →</button>
        <button class="btn-secondary" id="btn-skip-all">Rejoindre directement →</button>
        <div id="portrait-status"></div>
    </div>

    <div class="step" id="step-camera">
        <h2 id="expr-title">📸 Expression 1 / 6</h2>
        <div id="cam-container">
            <video id="cam-video" autoplay playsinline muted></video>
            <div id="cam-overlay">
                <div style="text-align:center;padding:16px">
                    <div style="font-size:30px">📷</div>
                    <div style="font-size:13px;margin-top:6px">Démarrage caméra…</div>
                </div>
            </div>
        </div>
        <div id="expr-label">—</div>
        <div id="expr-hint">—</div>
        <button id="btn-capture" title="Capturer"></button>
        <div id="thumbs"></div>
        <div id="cam-progress">0 / 6 capturées</div>
        <div id="cam-no-access">
            ⚠️ Caméra inaccessible (HTTP).<br>
            Chrome Android : <b>chrome://flags</b><br>
            → <i>Insecure origins treated as secure</i><br>
            → Ajouter <b>http://192.168.1.50:5000</b>
        </div>
        <button class="btn-primary"   id="btn-join" style="display:none">Rejoindre la partie →</button>
        <button class="btn-secondary" id="btn-skip-cam">Passer sans photo</button>
    </div>

</div>

<!-- ════════ LANDSCAPE : MANETTE ════════ -->
<div id="landscape">

    <!-- Joystick (direction) -->
    <div id="js-zone">
        <div id="js-label">DIRECTION</div>
        <div id="js-base">
            <div id="js-ring"></div>
            <div id="js-cross"></div>
            <div id="js-thumb"></div>
        </div>
    </div>

    <!-- Avatar + infos -->
    <div id="info-zone">
        <div id="avatar-circle"><div id="avatar-initial">?</div></div>
        <div id="info-name">—</div>
        <div id="conn-dot"></div>
    </div>

    <!-- Boutons -->
    <div id="btn-zone">
        <button class="game-btn" id="btn-go">
            <span class="btn-icon">▲</span>
            <span class="btn-text">AVANCER</span>
        </button>
        <button class="game-btn" id="btn-rev">
            <span class="btn-icon">▼</span>
            <span class="btn-text">RECULER</span>
        </button>
        <button class="game-btn" id="btn-hb">
            <span class="btn-icon">🅿</span>
            <span class="btn-text">FREIN</span>
        </button>
    </div>

</div>

<script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
<script>
const COLORS = [
    '#e74c3c','#e67e22','#f1c40f','#2ecc71','#1abc9c',
    '#3498db','#9b59b6','#e91e63','#ff5722','#00bcd4',
    '#8bc34a','#ff9800','#ecf0f1','#95a5a6','#ffffff','#34495e'
];
const EXPRESSIONS = [
    { label: '😐 Neutre',      hint: 'Visage détendu, regard droit' },
    { label: '😄 Souriant',    hint: 'Grand sourire !' },
    { label: '🤩 Excité',      hint: 'Euphorique, surpris !' },
    { label: '😡 En colère',   hint: 'Fâché, frustré !' },
    { label: '😤 Concentré',   hint: 'Intensément focalisé' },
    { label: '🏆 Victoire',    hint: 'Champion ! Célèbrez !' },
];

// ── Palette ───────────────────────────────────────────────────────────────────
let selColor = COLORS[0];
document.getElementById('palette').innerHTML = '';
COLORS.forEach(c => {
    const s = document.createElement('div');
    s.className = 'swatch' + (c === selColor ? ' on' : '');
    s.style.background = c;
    s.addEventListener('click', () => {
        document.querySelectorAll('.swatch').forEach(x => x.classList.remove('on'));
        s.classList.add('on'); selColor = c;
    });
    document.getElementById('palette').appendChild(s);
});

// ── Miniatures ────────────────────────────────────────────────────────────────
const thumbsEl = document.getElementById('thumbs');
const thumbSlots = [];
EXPRESSIONS.forEach((_, i) => {
    const slot = document.createElement('div');
    slot.className = 'thumb-slot' + (i === 0 ? ' active' : '');
    slot.textContent = i + 1;
    thumbsEl.appendChild(slot);
    thumbSlots.push(slot);
});

// ── Navigation ────────────────────────────────────────────────────────────────
function goToStep(id) {
    document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}
document.getElementById('btn-next').addEventListener('click', () => { goToStep('step-camera'); startCamera(); });
document.getElementById('btn-skip-all').addEventListener('click', () => { capturedPhotos = []; joinGame(); });

// ── Caméra ────────────────────────────────────────────────────────────────────
let videoStream = null;
const videoEl  = document.getElementById('cam-video');
const overlay  = document.getElementById('cam-overlay');
let capturedPhotos = [];
let currentExpr = 0;

async function startCamera() {
    updateExprUI();
    try {
        videoStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'user', width: { ideal: 240 }, height: { ideal: 240 } }
        });
        videoEl.srcObject = videoStream;
        overlay.classList.add('hidden');
        document.getElementById('cam-no-access').style.display = 'none';
    } catch {
        overlay.classList.add('hidden');
        document.getElementById('cam-no-access').style.display = 'block';
        document.getElementById('btn-capture').style.display = 'none';
        document.getElementById('btn-join').style.display = 'block';
    }
}
function stopCamera() { videoStream?.getTracks().forEach(t => t.stop()); videoStream = null; }

function updateExprUI() {
    const e = EXPRESSIONS[currentExpr];
    document.getElementById('expr-title').textContent    = `📸 Expression ${currentExpr + 1} / 6`;
    document.getElementById('expr-label').textContent    = e.label;
    document.getElementById('expr-hint').textContent     = e.hint;
    document.getElementById('cam-progress').textContent  = `${capturedPhotos.length} / 6 capturées`;
    thumbSlots.forEach((s, i) => s.classList.toggle('active', i === currentExpr && capturedPhotos.length < 6));
}

function capturePhoto() {
    const cv = document.createElement('canvas'); cv.width = cv.height = 96;
    const ctx = cv.getContext('2d');
    ctx.save(); ctx.translate(96, 0); ctx.scale(-1, 1);
    const vw = videoEl.videoWidth || 240, vh = videoEl.videoHeight || 240;
    const sz = Math.min(vw, vh);
    ctx.drawImage(videoEl, (vw - sz) / 2, (vh - sz) / 2, sz, sz, 0, 0, 96, 96);
    ctx.restore();
    return cv.toDataURL('image/jpeg', 0.75);
}

document.getElementById('btn-capture').addEventListener('click', () => {
    if (currentExpr >= 6) return;
    const dataUrl = videoEl.srcObject ? capturePhoto() : null;
    capturedPhotos.push(dataUrl);
    const slot = thumbSlots[currentExpr];
    slot.textContent = ''; slot.classList.add('done');
    if (dataUrl) { const img = document.createElement('img'); img.src = dataUrl; slot.appendChild(img); }
    else slot.textContent = '✓';
    currentExpr++;
    if (currentExpr >= 6) {
        document.getElementById('btn-capture').style.display = 'none';
        document.getElementById('btn-join').style.display    = 'block';
        document.getElementById('cam-progress').textContent  = '6 / 6 — Prêt !';
        thumbSlots.forEach(s => s.classList.remove('active'));
        stopCamera();
    } else updateExprUI();
});

document.getElementById('btn-skip-cam').addEventListener('click', () => { stopCamera(); capturedPhotos = []; joinGame(); });
document.getElementById('btn-join').addEventListener('click', () => { stopCamera(); joinGame(); });

// ── Connexion ─────────────────────────────────────────────────────────────────
let sock = null, joined = false;
let playerName = 'Joueur', playerColor = COLORS[0];

function joinGame() {
    playerName  = document.getElementById('inp-name').value.trim() || 'Joueur';
    playerColor = selColor;
    if (sock) sock.disconnect();
    sock = io(window.location.origin);
    sock.on('connect', () => sock.emit('register_mobile', { name: playerName, color: playerColor }));
    sock.on('connect_error', err => {
        document.getElementById('portrait-status').textContent = '❌ ' + err.message;
        goToStep('step-config');
    });
    sock.on('assigned', d => {
        joined = true;
        if (capturedPhotos.length > 0) sock.emit('player_photos', { photos: capturedPhotos });
        document.getElementById('info-name').textContent = d.name;
        document.getElementById('conn-dot').classList.add('ok');
        document.getElementById('avatar-circle').style.borderColor = d.color;
        _setAvatar(d.color);
        document.getElementById('portrait-status').textContent = '✅ Connecté ! Tournez en paysage.';
        startHB();
    });
    sock.on('game_full', () => {
        document.getElementById('portrait-status').textContent = '❌ Partie complète';
        goToStep('step-config');
    });
    sock.on('disconnect', () => { document.getElementById('conn-dot').classList.remove('ok'); joined = false; stopHB(); });
}

function _setAvatar(color) {
    const circle = document.getElementById('avatar-circle');
    circle.innerHTML = '';
    if (capturedPhotos.length > 0 && capturedPhotos[0]) {
        const img = document.createElement('img'); img.src = capturedPhotos[0]; circle.appendChild(img);
    } else {
        const ini = document.createElement('div'); ini.id = 'avatar-initial';
        ini.style.background = color;
        ini.style.width = '100%'; ini.style.height = '100%';
        ini.style.display = 'flex'; ini.style.alignItems = 'center'; ini.style.justifyContent = 'center';
        ini.style.fontSize = '22px'; ini.style.fontWeight = '900';
        ini.textContent = (playerName[0] || '?').toUpperCase();
        circle.appendChild(ini);
    }
}

let hbTimer = null;
function startHB() { stopHB(); hbTimer = setInterval(() => sock && joined && sock.emit('heartbeat'), 5000); }
function stopHB()  { if (hbTimer) { clearInterval(hbTimer); hbTimer = null; } }

// ── État inputs ───────────────────────────────────────────────────────────────
let jx = 0;           // steering (joystick uniquement)
let goPressed  = false;
let revPressed = false;
let hbPressed  = false;

function jy() {
    if (goPressed  && !revPressed) return -1;
    if (revPressed && !goPressed)  return  1;
    return 0;
}

// Envoi 30 fps
setInterval(() => {
    if (sock && joined) sock.emit('input', { jx, jy: jy(), brake: hbPressed });
}, 33);

// ── Joystick ──────────────────────────────────────────────────────────────────
const jsBase  = document.getElementById('js-base');
const jsThumb = document.getElementById('js-thumb');
const DEAD = 0.12, MAX_R = 0.9;
let jsTouchId = null;

function jsUpdate(touch) {
    const rect = jsBase.getBoundingClientRect();
    const r    = rect.width / 2;
    const cx   = rect.left + r, cy = rect.top + r;
    let dx = touch.clientX - cx, dy = touch.clientY - cy;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const maxPx = r * MAX_R;
    if (dist > maxPx) { dx *= maxPx / dist; dy *= maxPx / dist; }
    jsThumb.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    jsThumb.classList.add('active');
    const raw = dx / maxPx;
    jx = Math.abs(raw) < DEAD ? 0 : raw;
}
function jsReset() {
    jsTouchId = null; jx = 0;
    jsThumb.style.transform = 'translate(-50%, -50%)';
    jsThumb.classList.remove('active');
}

jsBase.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.changedTouches[0];
    jsTouchId = t.identifier;
    jsUpdate(t);
}, { passive: false });
jsBase.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.changedTouches) if (t.identifier === jsTouchId) { jsUpdate(t); break; }
}, { passive: false });
jsBase.addEventListener('touchend', e => {
    for (const t of e.changedTouches) if (t.identifier === jsTouchId) { jsReset(); break; }
}, { passive: false });
jsBase.addEventListener('touchcancel', jsReset, { passive: false });

// ── Boutons jeu ───────────────────────────────────────────────────────────────
function setupGameBtn(id, onDown, onUp) {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', e => { e.preventDefault(); el.classList.add('pressed'); onDown(); }, { passive: false });
    ['touchend', 'touchcancel'].forEach(ev =>
        el.addEventListener(ev, e => { e.preventDefault(); el.classList.remove('pressed'); onUp(); }, { passive: false })
    );
}
setupGameBtn('btn-go',  () => { goPressed  = true;  }, () => { goPressed  = false; });
setupGameBtn('btn-rev', () => { revPressed = true;  }, () => { revPressed = false; });
setupGameBtn('btn-hb',  () => { hbPressed  = true;  }, () => { hbPressed  = false; });

// ── Reset orientation ─────────────────────────────────────────────────────────
window.addEventListener('orientationchange', () => {
    jsReset(); goPressed = false; revPressed = false; hbPressed = false;
});
</script>
</body>
</html>
