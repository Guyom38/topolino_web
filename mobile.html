<head>

<style>
/* ══ RESET ══════════════════════════════════════════════════════ */
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#090b12;color:#fff}

/* ══ ORIENTATION ════════════════════════════════════════════════ */
#portrait,#landscape{position:absolute;inset:0;display:none}
@media(orientation:portrait) {#portrait {display:flex;flex-direction:column}}
@media(orientation:landscape){#landscape{display:flex}}

/* ══════════════════════════════════════════════════════════════
   PORTRAIT — SÉLECTION VÉHICULE
══════════════════════════════════════════════════════════════ */
#portrait{background:#090b12;overflow:hidden}

/* ── Header titre ── */
#hdr{
  flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:max(env(safe-area-inset-top,8px),8px) 16px 4px;
  position:relative;z-index:10;
  background:linear-gradient(180deg,rgba(0,0,0,0.85) 0%,transparent 100%);
}
#hdr-btns{
  position:absolute;top:max(env(safe-area-inset-top,8px),8px);right:14px;
  display:flex;gap:6px;
}
.hdr-btn{
  background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.15);
  border-radius:9px;padding:6px 9px;color:#fff;cursor:pointer;
  font-size:16px;touch-action:manipulation;line-height:1;
}
.hdr-btn:active{background:rgba(255,255,255,0.18)}

/* Titre TOPOLINO style page d'accueil */
.mob-title{
  font-family:'Bebas Neue','Impact','Arial Black',sans-serif;
  font-size:clamp(38px,11vw,58px);line-height:0.9;letter-spacing:0.06em;
  background:linear-gradient(175deg,#ffe566 0%,#ffaa00 38%,#ff5500 72%,#cc1800 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:titlePulse 4s ease-in-out infinite;
}
.mob-subtitle{
  font-family:'Bebas Neue','Impact',sans-serif;
  font-size:clamp(9px,2.8vw,14px);letter-spacing:0.35em;color:rgba(255,220,150,0.65);
  margin-top:-2px;
}
@keyframes titlePulse{
  0%,100%{filter:drop-shadow(2px 2px 0 #000) drop-shadow(-1px -1px 0 #000) drop-shadow(0 0 28px rgba(255,140,0,.45))}
  50%    {filter:drop-shadow(2px 2px 0 #000) drop-shadow(-1px -1px 0 #000) drop-shadow(0 0 55px rgba(255,190,0,.85))}
}

/* ── Aperçu 3D ── */
#preview-wrap{
  flex:1 1 0;position:relative;overflow:hidden;touch-action:none;min-height:0;
}
#preview-canvas{
  position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none;
}
#preview-loading{
  position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;
  background:#090b12;pointer-events:none;transition:opacity .5s;
}
#preview-loading.hidden{opacity:0}
#preview-loading.gone{display:none}
#preview-spinner{
  width:38px;height:38px;border-radius:50%;
  border:3px solid rgba(255,255,255,0.07);border-top-color:#ff5500;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.ld-txt{font-family:'Bebas Neue',Impact,sans-serif;font-size:12px;letter-spacing:4px;opacity:0.35}
#preview-hint{
  position:absolute;bottom:10px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,0.5);backdrop-filter:blur(6px);
  padding:4px 12px;border-radius:20px;
  font-family:'Oswald',Arial,sans-serif;font-size:10px;letter-spacing:1px;
  opacity:0.55;white-space:nowrap;pointer-events:none;
  border:1px solid rgba(255,255,255,0.08);
}

/* ── Panneau config ── */
#config-panel{
  flex:0 0 auto;
  padding:12px 16px max(env(safe-area-inset-bottom,14px),14px);
  background:linear-gradient(0deg,rgba(4,5,10,0.99),rgba(9,11,18,0.96));
  border-top:1px solid rgba(255,255,255,0.07);
  display:flex;flex-direction:column;gap:9px;
  position:relative;
}
/* Bande racing */
#config-panel::before{
  content:'';display:block;height:3px;border-radius:2px;margin-bottom:1px;
  background:linear-gradient(90deg,transparent,#ff5500 25%,#ffe566 50%,#ff5500 75%,transparent);
}

#name-row{display:flex;gap:8px;align-items:stretch}
#inp-name{
  flex:1;padding:11px 13px;
  background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.11);
  border-radius:11px;color:#fff;font-size:15px;font-weight:700;letter-spacing:2px;
  outline:none;font-family:'Arial Black','Arial Bold',Arial,sans-serif;-webkit-appearance:none;
}
#inp-name::placeholder{opacity:0.28;font-size:12px;letter-spacing:2px;font-weight:400}
#inp-name:focus{border-color:rgba(255,100,0,.5);background:rgba(255,85,0,.05)}

#btn-color-open{
  flex:0 0 50px;border-radius:11px;cursor:pointer;font-size:21px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,0.07);border:2px solid rgba(255,255,255,0.13);
  color:#fff;touch-action:manipulation;position:relative;overflow:hidden;
}
#btn-color-open::after{
  content:'';position:absolute;inset:0;border-radius:9px;
  background:var(--sel-color,#CC3322);opacity:0.3;pointer-events:none;
}
#btn-color-open:active{filter:brightness(.75)}

/* Toggle inverser */
#reverse-row{
  display:flex;align-items:center;gap:10px;
  padding:3px 2px;cursor:pointer;touch-action:manipulation;
}
#reverse-row input[type=checkbox]{display:none}
#toggle-track{
  width:38px;height:22px;border-radius:11px;flex:0 0 38px;
  background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.18);
  position:relative;transition:background .2s;
}
#toggle-track::after{
  content:'';position:absolute;left:3px;top:3px;
  width:14px;height:14px;border-radius:50%;
  background:#fff;transition:transform .2s,background .2s;
  box-shadow:0 1px 4px rgba(0,0,0,0.5);
}
#reverse-row.on #toggle-track{background:#ff5500;border-color:#ff5500}
#reverse-row.on #toggle-track::after{transform:translateX(16px)}
.toggle-label{
  font-family:'Bebas Neue',Impact,sans-serif;font-size:14px;letter-spacing:2px;
  opacity:0.65;flex:1;
}
.toggle-hint{font-family:'Segoe UI',Arial,sans-serif;font-size:10px;opacity:0.35;margin-left:auto}

/* Bouton primaire */
.btn-primary{
  width:100%;padding:13px 18px;border:none;cursor:pointer;touch-action:manipulation;
  background:linear-gradient(135deg,#ff5500 0%,#cc2200 100%);
  border-radius:12px;color:#fff;font-family:'Bebas Neue',Impact,sans-serif;
  font-size:18px;letter-spacing:4px;
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 4px 20px rgba(255,85,0,.35),inset 0 1px 0 rgba(255,255,255,.18);
  position:relative;overflow:hidden;
}
.btn-primary::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.1),transparent 50%)}
.btn-primary:active{filter:brightness(.8);transform:scale(.98)}

#portrait-status{
  font-family:'Oswald',Arial,sans-serif;font-size:11px;letter-spacing:1px;
  opacity:0.45;text-align:center;min-height:13px;
}

/* ══════════════════════════════════════════════════════════════
   MODAL COULEUR
══════════════════════════════════════════════════════════════ */
#color-modal{
  position:fixed;inset:0;z-index:300;
  display:flex;align-items:flex-end;justify-content:center;
  pointer-events:none;opacity:0;transition:opacity .2s;
}
#color-modal.open{pointer-events:all;opacity:1}
#color-modal-bg{position:absolute;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px)}
#color-modal-panel{
  position:relative;z-index:1;width:100%;max-width:500px;
  background:linear-gradient(180deg,#141720,#0d0f19);
  border-radius:22px 22px 0 0;
  border-top:1px solid rgba(255,255,255,0.12);
  padding:0 0 max(env(safe-area-inset-bottom,18px),18px);
  transform:translateY(40px);transition:transform .25s cubic-bezier(.2,.8,.4,1);
}
#color-modal.open #color-modal-panel{transform:translateY(0)}
#color-modal-panel::before{
  content:'';display:block;width:38px;height:4px;border-radius:2px;
  background:rgba(255,255,255,0.18);margin:12px auto 0;
}
#color-modal-hdr{
  display:flex;align-items:center;gap:10px;
  padding:12px 18px 10px;border-bottom:1px solid rgba(255,255,255,0.06);
}
#color-preview-dot{
  width:26px;height:26px;border-radius:50%;
  background:var(--sel-color,#CC3322);border:2px solid rgba(255,255,255,0.22);
  flex:0 0 auto;transition:background .15s;
}
#color-modal-hdr span{
  flex:1;font-family:'Bebas Neue',Impact,sans-serif;font-size:15px;letter-spacing:3px;opacity:0.65;
}
#btn-color-close{
  background:rgba(255,255,255,0.09);border:1px solid rgba(255,255,255,0.14);
  color:#fff;width:30px;height:30px;border-radius:50%;font-size:14px;
  cursor:pointer;touch-action:manipulation;
  display:flex;align-items:center;justify-content:center;
}
#btn-color-close:active{background:rgba(255,255,255,0.2)}

#color-tabs{display:flex;padding:10px 18px 6px;gap:8px}
.ctab{
  flex:1;padding:9px;cursor:pointer;touch-action:manipulation;
  background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);
  color:rgba(255,255,255,0.42);font-size:11px;letter-spacing:2px;border-radius:9px;
  font-family:'Bebas Neue',Impact,sans-serif;transition:all .15s;
}
.ctab.active{background:#ff5500;border-color:#ff5500;color:#fff;box-shadow:0 2px 10px rgba(255,85,0,.4)}
.ctab:active:not(.active){background:rgba(255,255,255,.1)}

.ctab-content{display:none;padding:8px 18px 10px}
.ctab-content.active{display:block}

#presets-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:4px 0}
.preset-swatch{
  aspect-ratio:1;border-radius:50%;cursor:pointer;touch-action:manipulation;
  border:3px solid transparent;
  transition:transform .12s,border-color .12s;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 2px 6px rgba(0,0,0,.4);
}
.preset-swatch.on{border-color:#fff;transform:scale(1.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 0 14px rgba(255,255,255,.35)}
.preset-swatch:active{transform:scale(1.08)}

#rgb-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding:8px 0}
#rgb-native{width:100%;height:60px;border:none;border-radius:12px;cursor:pointer;-webkit-appearance:none;background:none;padding:0}
#rgb-preview{width:68px;height:68px;border-radius:50%;border:3px solid rgba(255,255,255,.25);box-shadow:0 0 18px rgba(0,0,0,.5);transition:background .1s}

#btn-color-apply{margin:10px 18px 0;width:calc(100% - 36px)}

/* ══════════════════════════════════════════════════════════════
   LANDSCAPE — DOUBLE JOYSTICK
══════════════════════════════════════════════════════════════ */
#landscape{
  background:#090b12;align-items:stretch;justify-content:space-between;
  position:relative;overflow:hidden;touch-action:none;
}
/* Carbone */
#landscape::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:
    repeating-linear-gradient(0deg,transparent,transparent 18px,rgba(255,255,255,.012) 18px,rgba(255,255,255,.012) 19px),
    repeating-linear-gradient(90deg,transparent,transparent 18px,rgba(255,255,255,.012) 18px,rgba(255,255,255,.012) 19px);
}
/* Bande top */
#landscape::after{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;pointer-events:none;
  background:linear-gradient(90deg,transparent,#ff5500 20%,#ffe566 50%,#ff5500 80%,transparent);
}

.js-zone{
  flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;
  width:44vw;max-width:240px;gap:6px;
  padding:max(env(safe-area-inset-top,6px),6px) 8px max(env(safe-area-inset-bottom,6px),6px);
}
#js-left-zone {padding-left:max(env(safe-area-inset-left,8px),8px)}
#js-right-zone{padding-right:max(env(safe-area-inset-right,8px),8px)}

.js-label{
  font-family:'Bebas Neue',Impact,sans-serif;font-size:10px;letter-spacing:4px;opacity:0.28;
}
.js-base{position:relative;touch-action:none;width:min(42vw,200px);height:min(42vw,200px)}

.js-ring{
  position:absolute;inset:0;border-radius:50%;
  border:2px solid rgba(255,255,255,0.06);
  background:radial-gradient(circle,rgba(255,255,255,0.025) 0%,transparent 65%);
}
.js-ring::before{content:'';position:absolute;inset:10%;border-radius:50%;border:1px dashed rgba(255,255,255,0.04)}
.js-ring::after{content:'';position:absolute;inset:28%;border-radius:50%;border:1px solid rgba(255,255,255,0.025)}

.js-arrows{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;
  padding:0 12px;pointer-events:none;font-size:12px;opacity:0.1;
}
.js-arrows-tb{flex-direction:column;justify-content:space-between;align-items:center;padding:12px 0}

.js-thumb{
  position:absolute;width:64px;height:64px;border-radius:50%;
  top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;
}
#js-left-thumb{
  background:radial-gradient(circle at 34% 30%,#6688ff,#2244cc);
  box-shadow:0 4px 18px rgba(60,100,255,.45),0 0 0 3px rgba(80,120,255,.18),inset 0 1px 0 rgba(255,255,255,.22);
}
#js-left-thumb.active{box-shadow:0 4px 26px rgba(60,100,255,.85),0 0 0 5px rgba(80,120,255,.35),inset 0 1px 0 rgba(255,255,255,.25)}

#js-right-thumb{
  background:radial-gradient(circle at 34% 30%,#55dd88,#1a8844);
  box-shadow:0 4px 18px rgba(40,180,100,.45),0 0 0 3px rgba(60,200,120,.18),inset 0 1px 0 rgba(255,255,255,.22);
}
#js-right-thumb.active.fwd{
  background:radial-gradient(circle at 34% 30%,#66ffaa,#22cc66);
  box-shadow:0 4px 28px rgba(50,230,130,.9),0 0 0 6px rgba(60,255,130,.35),inset 0 1px 0 rgba(255,255,255,.28);
}
#js-right-thumb.active.rev{
  background:radial-gradient(circle at 34% 30%,#ff8833,#cc2200);
  box-shadow:0 4px 28px rgba(255,100,30,.9),0 0 0 6px rgba(255,120,50,.35),inset 0 1px 0 rgba(255,255,255,.28);
}

/* Centre HUD paysage */
#center-panel{
  flex:1 1 0;min-width:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;padding:0 4px;
}
#center-t{
  font-family:'Bebas Neue',Impact,sans-serif;
  font-size:clamp(30px,6vw,52px);font-weight:900;letter-spacing:2px;
  background:linear-gradient(175deg,#ffe566 0%,#ffaa00 38%,#ff5500 72%,#cc1800 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  line-height:1;filter:drop-shadow(0 0 12px rgba(255,140,0,.3));
}
#hud-avatar{
  width:42px;height:42px;border-radius:50%;
  border:2px solid rgba(255,255,255,.18);background:#1a1a2e;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  font-family:'Arial Black',Arial,sans-serif;font-size:17px;font-weight:900;
  transition:border-color .3s;
}
#hud-name{font-family:'Bebas Neue',Impact,sans-serif;font-size:11px;letter-spacing:2px;opacity:0.6;max-width:65px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
#throttle-wrap{width:5px;height:44px;border-radius:3px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);position:relative;overflow:hidden}
#throttle-bar{position:absolute;left:0;right:0;height:0;border-radius:2px;transition:height .05s,background .1s}
#conn-status{display:flex;align-items:center;gap:4px}
#conn-dot{width:7px;height:7px;border-radius:50%;background:#883333;box-shadow:0 0 5px #883333;transition:background .3s,box-shadow .3s}
#conn-dot.ok{background:#33cc77;box-shadow:0 0 8px #33cc77}
#conn-label{font-family:'Bebas Neue',Impact,sans-serif;font-size:8px;letter-spacing:2px;opacity:0.4}
</style>
</head>
<body>

<!-- ════════ PORTRAIT : SÉLECTION VÉHICULE ════════ -->
<div id="portrait">

  <div id="hdr">
    <div class="mob-title">TOPOLINO</div>
    <div class="mob-subtitle">LA CAISSE À MA MÈRE</div>
    <div id="hdr-btns">
      <button class="hdr-btn" id="btn-fs" title="Plein écran">⛶</button>
    </div>
  </div>

  <div id="preview-wrap">
    <canvas id="preview-canvas"></canvas>
    <div id="preview-loading">
      <div id="preview-spinner"></div>
      <div class="ld-txt">CHARGEMENT</div>
    </div>
    <div id="preview-hint">↔ Glisser · 🤏 Pincer pour zoomer</div>
  </div>

  <div id="config-panel">
    <div id="name-row">
      <input type="text" id="inp-name" placeholder="VOTRE NOM" maxlength="20"
             autocomplete="off" autocorrect="off" autocapitalize="characters">
      <button id="btn-color-open" title="Couleur véhicule">🎨</button>
    </div>

    <div id="reverse-row">
      <input type="checkbox" id="chk-reverse">
      <div id="toggle-track"></div>
      <label for="chk-reverse" class="toggle-label">INVERSER MARCHE ARRIÈRE</label>
      <span class="toggle-hint">↑↓</span>
    </div>

    <button class="btn-primary" id="btn-join">
      <span>REJOINDRE</span><span>→</span>
    </button>
    <div id="portrait-status"></div>
  </div>

</div>

<!-- ════════ MODAL COULEUR ════════ -->
<div id="color-modal">
  <div id="color-modal-bg"></div>
  <div id="color-modal-panel">
    <div id="color-modal-hdr">
      <div id="color-preview-dot"></div>
      <span>COULEUR DU VÉHICULE</span>
      <button id="btn-color-close">✕</button>
    </div>
    <div id="color-tabs">
      <button class="ctab active" data-tab="presets">PRESETS</button>
      <button class="ctab" data-tab="rgb">RGB</button>
    </div>
    <div id="ctab-presets" class="ctab-content active">
      <div id="presets-grid"></div>
    </div>
    <div id="ctab-rgb" class="ctab-content">
      <div id="rgb-wrap">
        <input type="color" id="rgb-native" value="#CC3322">
        <div id="rgb-preview"></div>
      </div>
    </div>
    <button class="btn-primary" id="btn-color-apply"><span>APPLIQUER</span><span>✓</span></button>
  </div>
</div>

<!-- ════════ LANDSCAPE : DOUBLE JOYSTICK ════════ -->
<div id="landscape">

  <div class="js-zone" id="js-left-zone">
    <div class="js-label">DIRECTION</div>
    <div id="js-left-base" class="js-base">
      <div class="js-ring"></div>
      <div class="js-arrows"><span>◀</span><span>▶</span></div>
      <div id="js-left-thumb" class="js-thumb"></div>
    </div>
  </div>

  <div id="center-panel">
    <div id="center-t">T</div>
    <div id="hud-avatar"><span id="hud-initial">?</span></div>
    <div id="hud-name">—</div>
    <div id="throttle-wrap"><div id="throttle-bar"></div></div>
    <div id="conn-status">
      <div id="conn-dot"></div>
      <span id="conn-label">HORS LIGNE</span>
    </div>
  </div>

  <div class="js-zone" id="js-right-zone">
    <div class="js-label">MOTEUR</div>
    <div id="js-right-base" class="js-base">
      <div class="js-ring"></div>
      <div class="js-arrows js-arrows-tb"><span>▲</span><span>▼</span></div>
      <div id="js-right-thumb" class="js-thumb"></div>
    </div>
  </div>

</div>

<script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
<script type="module">
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

// ════════════════════════════════════════════════════════════════
// LOCALSTORAGE — chargement initial
// ════════════════════════════════════════════════════════════════
const LS_NAME    = 'topolino_name';
const LS_COLOR   = 'topolino_color';
const LS_REVERSE = 'topolino_reverse';

function lsSave() {
  localStorage.setItem(LS_NAME,    document.getElementById('inp-name').value);
  localStorage.setItem(LS_COLOR,   selColor);
  localStorage.setItem(LS_REVERSE, reverseGear ? '1' : '0');
}
function lsLoad() {
  const name    = localStorage.getItem(LS_NAME)    || '';
  const color   = localStorage.getItem(LS_COLOR)   || '#CC3322';
  const reverse = localStorage.getItem(LS_REVERSE) === '1';
  document.getElementById('inp-name').value = name;
  setColor(color);
  setReverse(reverse);
}

let selColor     = '#CC3322';
let pendingColor = selColor;
let reverseGear  = false;

function setColor(hex) {
  selColor = hex;
  pendingColor = hex;
  document.documentElement.style.setProperty('--sel-color', hex);
  document.getElementById('color-preview-dot').style.background = hex;
  applyColorToPreview(hex);
}

function setReverse(val) {
  reverseGear = !!val;
  const row = document.getElementById('reverse-row');
  row.classList.toggle('on', reverseGear);
  document.getElementById('chk-reverse').checked = reverseGear;
}

const previewWrap = document.getElementById('preview-wrap');
const loadingEl   = document.getElementById('preview-loading');

renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x090b12);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x090b12, 0.035);

// ── Lumières ────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x9aaccc, 2.5));

const sun = new THREE.DirectionalLight(0xfff4e0, 6);
sun.position.set(5, 10, 6);
scene.add(sun);

const rim = new THREE.DirectionalLight(0xff4422, 1.8);
rim.position.set(-6, 2, -5);
scene.add(rim);

const fill = new THREE.DirectionalLight(0x4466ff, 1.0);
fill.position.set(0, -3, 7);
scene.add(fill);

// ── Sol ──────────────────────────────────────────────────────────
const floor = new THREE.Mesh(
  new THREE.CircleGeometry(7, 64),
  new THREE.MeshStandardMaterial({ color: 0x0e1018, roughness: 0.1, metalness: 0.75 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.02;
scene.add(floor);

// Anneau décoratif
const ring3d = new THREE.Mesh(
  new THREE.TorusGeometry(3.2, 0.012, 8, 100),
  new THREE.MeshStandardMaterial({ color: 0xff5500, emissive: 0xff3300, emissiveIntensity: 0.6 })
);
ring3d.rotation.x = -Math.PI / 2;
ring3d.position.y = -0.01;
scene.add(ring3d);

// ── Caméra orbitale ──────────────────────────────────────────────
let camTheta = -0.4;    // angle horizontal initial (légère rotation)
const CAM_PHI   = 0.30; // angle vertical fixe (~17°)
let camDist     = 5.8;
const CAM_D_MIN = 2.8;
const CAM_D_MAX = 12;
const CAM_TGT   = new THREE.Vector3(0, 0.8, 0);
const camera    = new THREE.PerspectiveCamera(42, 1, 0.1, 100);

function camUpdate() {
  camera.position.x = camDist * Math.cos(CAM_PHI) * Math.sin(camTheta);
  camera.position.y = camDist * Math.sin(CAM_PHI) + CAM_TGT.y;
  camera.position.z = camDist * Math.cos(CAM_PHI) * Math.cos(camTheta);
  camera.lookAt(CAM_TGT);
}
camUpdate();

// ── Groupe véhicule ──────────────────────────────────────────────
const carGroup = new THREE.Group();
scene.add(carGroup);

// ── Matériaux preview (d'après materials.js) ────────────────────
const enjolivSet = new Set(['z_roue_arriere_droite_jante_int','z_roue_arriere_gauche_jante_int','z_roue_avant_droite_jante_int','z_roue_avant_gauche_jante_int','lumineux_avant','lumineux_avant_001']);
const greySet    = new Set(['feux_avant','feux_avant_001','feux_avant_spot','logo_avant_fiat','logo_arriere_fiat','parchoque_arriere','parchoque_avant','roue_avant_droite_axe','roue_avant_droite_enjoliver','roue_avant_gauche_axes','roue_avant_gauche_enjoliver','roue_arriere_gauche_axe','roue_arriere_gauche_enjoliver','roue_arriere_droite_axe','roue_arriere_droite_enjoliver','support_bagage','phares_arriere_stop_001','phares_arriere_stop_002','phares_arrieres']);
const darkSet    = new Set(['z_support_bagage_bloc','z_support_bagage_bloc_001','bas_de_caisse','cache_moteur','essuie_glace','interieur_habitacle','roue_arriere_droite_jante_ext','roue_arriere_droite_pneu','roue_arriere_gauche_jante_ext','roue_arriere_gauche_pneu','roue_avant_droite_jante_ext','roue_avant_droite_pneu','roue_avant_gauche_jante_ext','roue_avant_gauche_pneu','z_interieur']);
const toitSet    = new Set(['y_carrosserie_arriere','y_carrosserie_arriere_001','y_carrosserie_avant','y_carrosserie_avant_001','y_carrosserie_laterales','y_carrosserie_portieres','y_carrosserie_retros','y_carrosserie_toit','y_carrosserie_toit_001']);
const rougeSet   = new Set(['lumineux_arriere_parchoque','phares_arriere_stop','italie_rouge','italie_rouge_001','lumineux_plaque','lumineux_portiere_droite','lumineux_portiere_gauche']);
const vitreSet   = new Set(['y_carrosserie_vitres_laterales','feux_avant_vitres','vitre_arriere','vitre_avant','vitre_toit','vitres_laterales','vitres_portieres']);
const blancSet   = new Set(['italie_blanc','italie_blanc_001']);
const vertSet    = new Set(['italie_vert','italie_vert_001']);

const M_ENJO  = new THREE.MeshStandardMaterial({ color:0xD8D8D8, roughness:0.25, metalness:0.50 });
const M_GRIS  = new THREE.MeshStandardMaterial({ color:0x8A8A8A, roughness:0.30, metalness:0.65 });
const M_DARK  = new THREE.MeshStandardMaterial({ color:0x3A3A3A, roughness:0.40, metalness:0.55 });
const M_TOIT  = new THREE.MeshStandardMaterial({ color:0x0F1520, roughness:0.60, metalness:0.10 });
const M_ROUGE = new THREE.MeshStandardMaterial({ color:0xCC1111, roughness:0.35, metalness:0.10, emissive:new THREE.Color(0x220000) });
const M_VITRE = new THREE.MeshStandardMaterial({ color:0x99CCDD, roughness:0.05, metalness:0.10, transparent:true, opacity:0.30, depthWrite:false });
const M_BLANC = new THREE.MeshStandardMaterial({ color:0xFFFFFF, roughness:0.35, metalness:0.10 });
const M_VERT  = new THREE.MeshStandardMaterial({ color:0x009246, roughness:0.35, metalness:0.10 });
const M_LEATH = new THREE.MeshStandardMaterial({ color:0x5a3020, roughness:0.80 });
const M_FABR  = new THREE.MeshStandardMaterial({ color:0x442244, roughness:0.90 });
let   M_BODY  = new THREE.MeshStandardMaterial({ color:new THREE.Color(selColor), roughness:0.35, metalness:0.45 });

function getMeshMat(name) {
  const n = name.toLowerCase();
  if (n === 'bagage_001')   return M_FABR;
  if (n === 'bagage' || n === 'bagage_sangles' || n === 'bagage_ceinture') return M_LEATH;
  if (enjolivSet.has(n)) return M_ENJO;
  if (greySet.has(n))    return M_GRIS;
  if (darkSet.has(n))    return M_DARK;
  if (toitSet.has(n))    return M_TOIT;
  if (rougeSet.has(n))   return M_ROUGE;
  if (vitreSet.has(n))   return M_VITRE;
  if (blancSet.has(n))   return M_BLANC;
  if (vertSet.has(n))    return M_VERT;
  return M_BODY;
}

function applyColorToPreview(hex) {
  M_BODY.color.set(hex);
  M_BODY.needsUpdate = true;
}

// ── Chargement FBX ───────────────────────────────────────────────
const loader = new FBXLoader();
loader.load('Asssets/topolino_low49k.fbx',
  fbx => {
    // 1. Appliquer les matériaux
    fbx.traverse(child => {
      if (!child.isMesh) return;
      child.material = getMeshMat(child.name);
      child.castShadow = false;
      child.receiveShadow = false;
    });

    // 2. Scale (avant de positionner)
    const box0 = new THREE.Box3().setFromObject(fbx);
    const sz0  = box0.getSize(new THREE.Vector3());
    const maxD = Math.max(sz0.x, sz0.y, sz0.z);
    const s    = maxD > 0 ? 3.2 / maxD : 1;
    fbx.scale.setScalar(s);

    // 3. Position correcte après scale
    const box1 = new THREE.Box3().setFromObject(fbx);
    const c1   = box1.getCenter(new THREE.Vector3());
    fbx.position.x = -c1.x;
    fbx.position.z = -c1.z;
    fbx.position.y = -box1.min.y;   // bottom à y=0

    carGroup.add(fbx);

    // 4. Masquer le chargement
    loadingEl.classList.add('hidden');
    setTimeout(() => loadingEl.classList.add('gone'), 600);
  },
  null,
  err => {
    console.error('[mobile] FBX error:', err);
    loadingEl.innerHTML = '<div style="font-family:Bebas Neue,Impact,sans-serif;color:#ff5500;letter-spacing:3px;font-size:13px">ERREUR DE CHARGEMENT</div>';
  }
);

// ── Resize renderer ──────────────────────────────────────────────
function resizePreview() {
  const w = previewWrap.offsetWidth;
  const h = previewWrap.offsetHeight;
  if (!w || !h) return;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
resizePreview();
setTimeout(resizePreview, 80);
setTimeout(resizePreview, 400);
window.addEventListener('resize', resizePreview);
new ResizeObserver(resizePreview).observe(previewWrap);
window.addEventListener('orientationchange', () => setTimeout(resizePreview, 200));

// ── Boucle de rendu ──────────────────────────────────────────────
let autoRot = true;
let autoRotTimer = null;

(function renderLoop() {
  requestAnimationFrame(renderLoop);
  if (autoRot) {
    camTheta += 0.004;
    camUpdate();
  }
  ring3d.rotation.z -= 0.003;
  renderer.render(scene, camera);
})();

// ════════════════════════════════════════════════════════════════
// TOUCH : rotation 1 doigt + zoom 2 doigts
// ════════════════════════════════════════════════════════════════
let pt1 = null, pinchDist0 = null, camDist0 = camDist, camTheta0 = camTheta;

function stopAuto() {
  autoRot = false;
  clearTimeout(autoRotTimer);
  autoRotTimer = setTimeout(() => { autoRot = true; }, 2800);
}

previewWrap.addEventListener('touchstart', e => {
  e.preventDefault();
  stopAuto();
  if (e.touches.length === 1) {
    pt1 = { x: e.touches[0].clientX };
    camTheta0 = camTheta;
    pinchDist0 = null;
  } else if (e.touches.length >= 2) {
    const dx = e.touches[1].clientX - e.touches[0].clientX;
    const dy = e.touches[1].clientY - e.touches[0].clientY;
    pinchDist0 = Math.sqrt(dx*dx + dy*dy);
    camDist0   = camDist;
    pt1 = { x: (e.touches[0].clientX + e.touches[1].clientX) / 2 };
    camTheta0 = camTheta;
  }
}, { passive: false });

previewWrap.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 1 && pt1 && pinchDist0 === null) {
    camTheta = camTheta0 - (e.touches[0].clientX - pt1.x) * 0.013;
    camUpdate();
  } else if (e.touches.length >= 2 && pinchDist0 !== null) {
    const dx = e.touches[1].clientX - e.touches[0].clientX;
    const dy = e.touches[1].clientY - e.touches[0].clientY;
    const d  = Math.sqrt(dx*dx + dy*dy);
    camDist  = Math.max(CAM_D_MIN, Math.min(CAM_D_MAX, camDist0 * (pinchDist0 / d)));
    const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    camTheta = camTheta0 - (midX - pt1.x) * 0.010;
    camUpdate();
  }
}, { passive: false });

previewWrap.addEventListener('touchend', e => {
  e.preventDefault();
  if (e.touches.length === 0) {
    pt1 = null; pinchDist0 = null;
  } else if (e.touches.length === 1) {
    pt1 = { x: e.touches[0].clientX };
    camTheta0 = camTheta;
    pinchDist0 = null;
  }
}, { passive: false });

previewWrap.addEventListener('touchcancel', () => {
  pt1 = null; pinchDist0 = null;
  autoRot = true; clearTimeout(autoRotTimer);
}, { passive: false });

function tap(id, fn) {

  el.addEventListener('touchend', e => { e.preventDefault(); fn(); }, { passive: false });
  el.addEventListener('click', fn);
}

// SOCKET.IO + CONNEXION
// ════════════════════════════════════════════════════════════════
let sock = null, joined = false;

function joinGame() {
  const playerName = (document.getElementById('inp-name').value.trim() || 'JOUEUR').toUpperCase();
  const status = document.getElementById('portrait-status');
  status.textContent = 'CONNEXION…';
  lsSave();

  if (sock) { sock.disconnect(); sock = null; }
  sock = io(window.location.origin);

  sock.on('connect', () => {
    sock.emit('register_mobile', { name: playerName, color: selColor });
  });
  sock.on('connect_error', err => {
    status.textContent = '❌ ' + err.message;
  });
  sock.on('assigned', d => {
    joined = true;
    status.textContent = '✅ CONNECTÉ ! TOURNEZ EN PAYSAGE.';
    document.getElementById('hud-name').textContent    = (d.name || playerName).substring(0, 8).toUpperCase();
    document.getElementById('hud-initial').textContent = ((d.name || playerName)[0] || '?').toUpperCase();
    document.getElementById('hud-avatar').style.borderColor = d.color || selColor;
    document.getElementById('conn-dot').classList.add('ok');
    document.getElementById('conn-label').textContent = 'EN LIGNE';
    startHB();
  });
  sock.on('game_full', () => { status.textContent = '❌ PARTIE COMPLÈTE'; });
  sock.on('disconnect', () => {
    joined = false;
    document.getElementById('conn-dot').classList.remove('ok');
    document.getElementById('conn-label').textContent = 'DÉCONNECTÉ';
    stopHB();
  });
}

tap('btn-join', joinGame);

let hbTimer = null;
function startHB() { stopHB(); hbTimer = setInterval(() => sock && joined && sock.emit('heartbeat'), 5000); }
function stopHB()  { clearInterval(hbTimer); hbTimer = null; }

let leftJx = 0, rightJy = 0;

// Envoi 30fps
setInterval(() => {
  if (!sock || !joined) return;
  // Inverser Y si reverse activé
  const jy = reverseGear ? -rightJy : rightJy;
  sock.emit('input', { jx: leftJx, jy, brake: false });
}, 33);

// Indicateur visuel moteur
const throttleBar = document.getElementById('throttle-bar');
setInterval(() => {
  const v = reverseGear ? -rightJy : rightJy;
  const px = Math.abs(v) * 20;
  throttleBar.style.height = px + 'px';
  if (v < -0.1) {
    throttleBar.style.bottom = '50%'; throttleBar.style.top = 'auto';
    throttleBar.style.background = '#33dd77';
    throttleBar.style.boxShadow  = '0 0 5px #33dd77';
  } else if (v > 0.1) {
    throttleBar.style.top = '50%'; throttleBar.style.bottom = 'auto';
    throttleBar.style.background = '#ff8844';
    throttleBar.style.boxShadow  = '0 0 5px #ff8844';
  } else {
    throttleBar.style.height = '0';
  }
}, 33);

// ── Factory joystick ─────────────────────────────────────────────
function makeJoystick(baseEl, thumbEl, onUpdate) {
  const DEAD  = 0.10;
  const MAX_R = 0.82;
  let tid = null;

  function update(touch) {
    const r  = baseEl.getBoundingClientRect();
    const cx = r.left + r.width  * 0.5;
    const cy = r.top  + r.height * 0.5;
    let dx = touch.clientX - cx;
    let dy = touch.clientY - cy;
    const dist  = Math.sqrt(dx*dx + dy*dy);
    const maxPx = (r.width * 0.5) * MAX_R;
    if (dist > maxPx) { const s = maxPx / dist; dx *= s; dy *= s; }

    thumbEl.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    thumbEl.classList.add('active');

    const nx = Math.abs(dx / maxPx) < DEAD ? 0 : dx / maxPx;
    const ny = Math.abs(dy / maxPx) < DEAD ? 0 : dy / maxPx;

    if (thumbEl.id === 'js-right-thumb') {
      thumbEl.classList.remove('fwd','rev');
      if (ny < -0.15) thumbEl.classList.add(reverseGear ? 'rev' : 'fwd');
      else if (ny > 0.15) thumbEl.classList.add(reverseGear ? 'fwd' : 'rev');
    }
    onUpdate(nx, ny);
  }

  function reset() {
    tid = null;
    thumbEl.style.transform = 'translate(-50%,-50%)';
    thumbEl.classList.remove('active','fwd','rev');
    onUpdate(0, 0);
  }

  baseEl.addEventListener('touchstart', e => {
    e.preventDefault();
    if (tid !== null) return;
    const t = e.changedTouches[0]; tid = t.identifier; update(t);
  }, { passive: false });

  baseEl.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.changedTouches) if (t.identifier === tid) { update(t); break; }
  }, { passive: false });

  ['touchend','touchcancel'].forEach(ev =>
    baseEl.addEventListener(ev, e => {
      e.preventDefault();
      for (const t of e.changedTouches) if (t.identifier === tid) { reset(); break; }
    }, { passive: false })
  );
}

makeJoystick(document.getElementById('js-left-base'),  document.getElementById('js-left-thumb'),
  (_, y) => { rightJy = y; });

makeJoystick(document.getElementById('js-right-base'), document.getElementById('js-right-thumb'),
  (x, _) => { leftJx  = x; });

window.addEventListener('orientationchange', () => {
  leftJx = 0; rightJy = 0;
  ['js-left-thumb','js-right-thumb'].forEach(id => {
    const el = document.getElementById(id);
    el.style.transform = 'translate(-50%,-50%)';
    el.classList.remove('active','fwd','rev');
  });
});
